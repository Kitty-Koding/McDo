<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>McDonald's Locations</title>
	<script src="https://d3js.org/d3.v5.min.js"></script>
	<style>
		svg {
			border: 1px solid black;
		}
	</style>
</head>
<body>
	<script>
       var w = window.innerWidth;
       var h = window.innerHeight;

       var projection = d3.geoAlbersUsa()
           .translate([w / 2, h / 2])
           .scale([1000]);

       var path = d3.geoPath().projection(projection);

       var svg = d3.select("body")
           .append("svg")
           .attr("width", w)
           .attr("height", h);

       // Load both files using Promises
       Promise.all([
           d3.json("https://kitty-koding.github.io/McDo/usStates.json"),  // Corrected link to usStates.json
           d3.json("https://kitty-koding.github.io/McDo/mcdonalds.geojson")  // Assuming this file is correct
       ]).then(function([usData, storeData]) {

           // Get the min and max store numbers
           var storeNumbers = storeData.features.map(function(d) {
               return d.properties.storeNumber;
           });

           var minStoreNumber = d3.min(storeNumbers);
           var maxStoreNumber = d3.max(storeNumbers);

           svg.selectAll("path")
               .data(usData.features)
               .enter()
               .append("path")
               .attr("d", path)
               .style("fill", "#ddd").style("stroke","#fff").style("stroke-width","5px");

           svg.selectAll("circle")
               .data(storeData.features)
               .enter()
               .append("circle")
               .attr("cx", function(d) {
                   var coords = projection(d.geometry.coordinates);
                   return coords ? coords[0] : -1000;
               })
               .attr("cy", function(d) {
                   var coords = projection(d.geometry.coordinates);
                   return coords ? coords[1] : -1000;
               })
               .attr("r", 1)
               .style("fill", function(d) {
                    if(d.properties.playplace === "Y"){
                        return "red";
                    }else{
                        return "yellow";
                    }
               })
               .style("opacity", 0.75)
               .append("title")
               .text(function(d) {
                   return `#${d.properties.storeNumber} - ${d.properties.city}, ${d.properties.state}`;
               });
       }).catch(function(error) {
           console.error("Error loading data: ", error);
       });
	</script>
</body>
</html>
